<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MasterMind main window mockup v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  MasterMind M1 mockup, version 3, 2026-11-26. Not plugin code.
  v3: smaller spectrum; all ten modules fit in two rows without scrolling.
  v2 adds knob tooltips (Russian text, ASD-STE100 writing rules). Hover a knob to see one.
  Query parameters: view=master|eyes|compact, monitor=0|1, tip=0|1, knob=<knob id> (pins one knob tooltip)
  The design is drawn at the mode's reference size (Full 1280x800, Compact 640x400)
  and scaled uniformly to the viewport, like the plugin's fluid vector scaling.
-->
<style>
:root{
  --bg:#111317; --panel:#171a20; --panel2:#1d2129; --sunk:#0d0f13; --line:#272c35; --line2:#343a46;
  --text:#e8eaee; --text2:#a4acb9; --text3:#6f7786;
  --blue:#4ea1ff; --orange:#ff9f43; --yellow:#ffd84d; --magenta:#e35bd8;
  --ok:#3ccf91; --warn:#f2c23a; --bad:#ff5468; --info:#7fb3ff; --mon:#e3262f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:12px;color:var(--text);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
.win{background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.win.monitor::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--mon);z-index:5}
.win.monitor{box-shadow:inset 0 0 0 2px var(--mon)}

/* top bar */
.top{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:15px;white-space:nowrap;margin-right:2px;letter-spacing:.1px}
.logo b{color:var(--orange);font-weight:700}
.grp{display:flex;align-items:center;gap:4px;height:36px;padding:0 5px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.grp .cap{color:var(--text3);font-size:12px;margin:0 2px 0 1px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 7px;border-radius:5px;background:#262b34;border:1px solid var(--line2);color:var(--text);white-space:nowrap}
.btn.ic{width:22px;padding:0;color:var(--text2)}
.btn.tog.on{background:#2d4f7c;border-color:#4a76ad;color:#fff}
.btn.size{font-weight:600;min-width:50px}
.dd{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 7px;border-radius:5px;background:var(--sunk);border:1px solid var(--line2);white-space:nowrap}
.dd .car{color:var(--text3);font-size:10px;margin-left:auto}
.dd .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dd .mod{margin-left:-4px}
.mod{color:var(--orange);font-weight:700}
.seg{display:inline-flex;height:24px;border:1px solid var(--line2);border-radius:5px;overflow:hidden;background:var(--sunk)}
.seg span{display:flex;align-items:center;padding:0 7px;color:var(--text2);border-right:1px solid var(--line2)}
.seg span:last-child{border-right:0}
.seg span.on{background:#2d4f7c;color:#fff}
.ro{color:var(--text2);margin-left:2px}
.monGrp.active{background:var(--mon);border-color:#ff6a70}
.monGrp.active .cap{color:#fff}
.monBadge{display:none;font-weight:700;color:#fff;letter-spacing:.2px;padding:0 4px}
.monGrp.active .monBadge{display:inline-flex}
.monGrp.active .seg{background:#7d1218;border-color:#ff8a8f}
.monGrp.active .seg span{color:#ffd9db;border-color:#ff8a8f}
.monGrp.active .seg span.on{background:#fff;color:#a3121a;font-weight:600}
.monGrp.active .dd{background:#7d1218;border-color:#ff8a8f;color:#fff}
.monGrp.active .dd .car{color:#ffc2c5}
.ref{width:22px;height:24px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);color:var(--text2);background:#262b34;font-weight:500}
.ref.empty{background:transparent;border-style:dashed;color:var(--text3)}
.ref.sel{background:var(--magenta);border-color:var(--magenta);color:#1a0b19;font-weight:700}
.meters{gap:9px;padding:0 8px}
.mtr{display:flex;align-items:baseline;gap:4px}
.mtr .k{color:var(--text3)}
.mtr .v{font-size:15px;font-weight:600}
.mtr .u{color:var(--text3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;align-self:center}
.spacer{flex:1}

/* tabs */
.tabs{height:34px;flex:none;display:flex;align-items:stretch;gap:2px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;padding:0 14px;color:var(--text2);font-weight:500;border-bottom:2px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--orange)}
.tabs .right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--text2)}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--text2)}
.chk i{width:13px;height:13px;border-radius:3px;border:1px solid var(--line2);background:#2d4f7c;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;color:#fff}

/* content */
.content{flex:1;min-height:0;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.ph{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-size:13px;font-weight:600;white-space:nowrap}
.ph .sub{color:var(--text3);white-space:nowrap}
.ph .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.legend{display:flex;gap:10px;color:var(--text2);white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
.approx{color:var(--text3);font-style:italic}

/* footer */
.foot{height:24px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--text3)}
.foot .right{margin-left:auto;display:flex;gap:16px;padding-right:14px}
.grip{position:absolute;right:2px;bottom:2px;width:12px;height:12px;background:
  linear-gradient(135deg,transparent 0 55%,var(--text3) 55% 62%,transparent 62% 72%,var(--text3) 72% 79%,transparent 79%)}

/* module strip */
.strip{flex:none}
.chainmap{display:flex;gap:4px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--text2)}
.pill.cur{border-color:var(--orange);color:#fff}
.led{width:7px;height:7px;border-radius:50%;background:#3a404b;display:inline-block;flex:none}
.led.on{background:var(--ok);box-shadow:0 0 6px rgba(60,207,145,.7)}
.cards{display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;flex:1;min-height:0}
.crow{display:flex;gap:8px;flex:1;min-height:0}
.card{flex:1 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:7px;display:flex;flex-direction:column}
.card.off{opacity:.55}
.card.cur{border-color:var(--orange)}
/* info rows and band chips take the card width but do not widen the card */
.cbd > .row:not(.bars),.cbd > .bandchips{contain:inline-size}
.card .chd{height:28px;display:flex;align-items:center;gap:7px;padding:0 9px;border-bottom:1px solid var(--line)}
.card .chd b{font-weight:600;white-space:nowrap}
.card .chd .r{margin-left:auto;color:var(--text3);white-space:nowrap}
.card .cbd{flex:1;padding:7px 8px 6px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px 4px}
.knob{min-width:48px;padding:0 2px;display:flex;flex-direction:column;align-items:center}
.knob .kv{font-weight:600;margin-top:1px;white-space:nowrap}
.knob .kl{color:var(--text3);white-space:nowrap}
.row{display:flex;align-items:center;gap:6px;width:100%}
.mini{color:var(--text3)}
.grbar{display:flex;flex-direction:column;align-items:center;gap:3px;width:34px}
.grbar .t{width:10px;height:50px;border-radius:3px;background:var(--sunk);border:1px solid var(--line2);position:relative;overflow:hidden}
.grbar .t i{position:absolute;left:0;right:0;top:0;background:var(--orange)}
.scroll{height:6px;margin:6px 10px 6px;border-radius:3px;background:var(--sunk);position:relative}
.scroll i{position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:3px;background:#3a414d}
.bandchips{display:flex;gap:3px;width:100%}
.bandchips span{flex:1;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:var(--sunk);border:1px solid var(--line2);color:var(--text3)}
.bandchips span.a{color:var(--text);border-color:#6b5d2a}
.bandchips span.s{background:var(--yellow);color:#1b1600;border-color:var(--yellow);font-weight:700}

/* eyes */
.grid{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:510px 1fr 318px;grid-template-rows:362px 1fr}
.tb{padding:6px 12px 8px;display:flex;flex-direction:column;gap:4px;flex:1}
.tbrow{display:grid;grid-template-columns:92px 1fr 64px 22px;align-items:center;gap:10px;height:36px}
.tbrow .n b{display:block;font-weight:600}
.tbrow .n span{color:var(--text3)}
.track{position:relative;height:22px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.track .cor{position:absolute;top:0;bottom:0;background:rgba(78,161,255,.16);border-left:1px solid rgba(78,161,255,.5);border-right:1px solid rgba(78,161,255,.5)}
.track .zero{position:absolute;top:-3px;bottom:-3px;width:2px;background:#cfe3ff;left:50%;margin-left:-1px}
.track .val{position:absolute;top:5px;bottom:5px;border-radius:2px}
.track .mk{position:absolute;top:2px;bottom:2px;width:4px;border-radius:2px;margin-left:-2px;background:#fff}
.tbrow .num{text-align:right;font-weight:600;font-size:14px}
.scale{display:grid;grid-template-columns:92px 1fr 64px 22px;gap:10px;color:var(--text3)}
.scale div.s{display:flex;justify-content:space-between}
.sentence{margin-top:auto;padding:8px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.sentence b{font-weight:600}
.light{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#111;flex:none}
.light.ok{background:var(--ok);border-radius:50%}
.light.warn{background:var(--warn);clip-path:polygon(50% 4%,98% 94%,2% 94%);padding-top:4px}
.light.bad{background:var(--bad);border-radius:3px}
.light.info{background:transparent;border:1.5px solid var(--info);border-radius:50%;color:var(--info);font-style:italic;font-family:Georgia,serif}
.ld{padding:8px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.big{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.bigv{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.bigv .k{color:var(--text3)}
.bigv .v{font-size:26px;font-weight:600;line-height:1.15}
.bigv.main .v{font-size:30px;color:#fff}
.bigv .u{color:var(--text2);font-size:12px;margin-left:3px;font-weight:500}
.kv4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kvc{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;line-height:1.3}
.kvc .k{color:var(--text3)}
.kvc .v{font-weight:600;font-size:14px}
.kvc .v small{font-size:12px;color:var(--text2);font-weight:500}
.checks{padding:4px 6px;display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:22px 1fr auto;column-gap:8px;align-items:center;padding:5px 6px;border-radius:6px;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .t{font-weight:600}
.ck .d{grid-column:2/4;color:var(--text2);font-size:12px;line-height:1.3}
.ck .v{font-weight:600;text-align:right}
.ck.hl{background:#2a1f25;outline:1px solid #6d3341}
.tip{position:absolute;z-index:10;width:290px;padding:10px 12px;border-radius:8px;background:#f2f4f7;color:#15171b;box-shadow:0 8px 24px rgba(0,0,0,.55);line-height:1.4}
.tip b{display:block;margin-bottom:3px}
.tip::after{content:"";position:absolute;right:-7px;top:18px;border:7px solid transparent;border-right:0;border-left-color:#f2f4f7}
.stereo{display:flex;gap:12px;padding:8px 12px;flex:1;min-height:0}
table.bt{border-collapse:collapse;width:100%}
table.bt th{color:var(--text3);font-weight:500;text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
table.bt th:first-child,table.bt td:first-child{text-align:left}
table.bt td{padding:4px 4px;text-align:right;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
.corr{position:relative;height:16px;border-radius:4px;background:linear-gradient(90deg,rgba(255,84,104,.35),rgba(242,194,58,.25) 50%,rgba(60,207,145,.35));border:1px solid var(--line2)}
.corr i{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:#fff;border-radius:2px}
.cs{display:flex;justify-content:space-between;color:var(--text3);margin-top:2px}

/* compact */
.c .top{height:38px;gap:6px;padding:0 6px}
.c .logo{font-size:13px}
.c .grp{height:28px;padding:0 4px;gap:3px}
.c .btn,.c .dd,.c .seg{height:22px}
.c .tabs{height:28px;padding:0 6px}
.c .tab{padding:0 9px}
.c .content{padding:6px;gap:6px}
.c .foot{height:20px;font-size:11px;gap:10px;padding:0 8px}
.c .ph{height:28px;padding:0 8px}
.c .ck{padding:3px 4px;column-gap:6px}
.c .light{width:15px;height:15px;font-size:10px}
/* knob tooltips (v2) */
.knob{cursor:pointer;border-radius:6px}
.knob.hov{background:#262b34;box-shadow:0 0 0 1px var(--line2)}
.ktip{position:absolute;z-index:20;width:336px;padding:10px 12px 8px;border-radius:8px;background:#f2f4f7;color:#15171b;box-shadow:0 10px 28px rgba(0,0,0,.6);line-height:1.38;font-size:12px;pointer-events:none}
.ktip .h{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.ktip .h b{font-size:13px;white-space:nowrap}
.ktip .h span{margin-left:auto;color:#3f4652;font-weight:600;white-space:nowrap}
.ktip .s{display:grid;grid-template-columns:64px 1fr;column-gap:6px;margin-top:5px}
.ktip .s i{font-style:normal;color:#5b6370;font-weight:600}
.ktip .s.w i{color:#b3261e}
.ktip .f{margin-top:8px;padding-top:5px;border-top:1px solid #d3d8df;color:#5b6370;display:flex;gap:8px}
.ktip .f .off{margin-left:auto;color:#b3261e;font-weight:600;white-space:nowrap}
.ktip::after{content:"";position:absolute;left:var(--ax,50%);margin-left:-7px;border:7px solid transparent}
.ktip.up::after{bottom:-14px;border-top-color:#f2f4f7}
.ktip.dn::after{top:-14px;border-bottom-color:#f2f4f7}
/* mockup bar (not part of the plugin) */
#mbar{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:7px max(12px, env(safe-area-inset-left, 0px));background:#050608;border-bottom:1px solid #22262e;color:#a4acb9;font-size:13px}
#mbar .mt{color:#e8eaee;font-weight:600;margin-right:4px}
#mbar .mg{display:inline-flex;border:1px solid #343a46;border-radius:6px;overflow:hidden}
#mbar button{font:inherit;color:#c9ced6;background:#14171c;border:0;padding:5px 11px;cursor:pointer}
#mbar .mg button+button{border-left:1px solid #343a46}
#mbar button.on{background:#2b4a73;color:#fff}
#mbar button.mm{border:1px solid #343a46;border-radius:6px}
#mbar button.mm.on{background:var(--mon);border-color:#ff6a70;color:#fff}
#mbar button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
#mbar .mi{color:#6f7786}
#mbar .mh{flex-basis:100%}
@media (min-width:1100px){#mbar .mh{flex-basis:auto;margin-left:auto}}
#mToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#f2f4f7;color:#15171b;padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#mToast[hidden],#mbar[hidden]{display:none}
.tab,.monGrp,.btn.size{cursor:pointer}
</style>
</head>
<body>
<div id="mbar">
  <b class="mt">MasterMind · макет v3</b>
  <span class="mg"><button type="button" id="vMaster" data-view="master">Master</button><button type="button" id="vEyes" data-view="eyes">Eyes</button><button type="button" id="vCompact" data-view="compact">Компактный</button></span>
  <span class="mg"><button type="button" id="s100" data-size="100">100%</button><button type="button" id="s120" data-size="120">120%</button></span>
  <button type="button" id="mMon" class="mm">Мониторинг: выкл</button>
  <span id="mInfo" class="mi"></span>
  <span class="mi mh">Наведите курсор на ручку: через 0,5 с появится подсказка. Вкладки, Monitor и кнопка размера в окне тоже нажимаются.</span>
</div>
<div id="mToast" hidden></div>
<div id="stage"></div>
<script>
const P = new URLSearchParams(location.search);
let VIEW = P.get('view') || 'master';
let MON = P.get('monitor') === '1';
let TIP = P.get('tip') === '1';
let COMPACT = VIEW === 'compact';
let DW = COMPACT ? 640 : 1280, DH = COMPACT ? 400 : 800;
let SIZE = 100; // 100 or 120, interactive mode only
const SHOT = location.search.length > 1; // query string = static PNG render, no mockup bar

/* ---------- helpers ---------- */
const LF = Math.log10(20), HF = Math.log10(20000);
const fx = (f, w, lo = 20, hi = 20000) => (Math.log10(f) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * w;
const gauss = (f, f0, g, bw) => { const o = Math.log2(f / f0); return g * Math.exp(-(o * o) / (2 * bw * bw)); };
const hp = (f, fc, n) => -10 * Math.log10(1 + Math.pow(fc / f, 2 * n));
const lp = (f, fc, n) => -10 * Math.log10(1 + Math.pow(f / fc, 2 * n));
const rip = (f, s) => { const l = Math.log2(f); return 0.9 * Math.sin(l * 5.1 + s) + 0.6 * Math.sin(l * 11.3 + s * 2) + 0.35 * Math.sin(l * 23.7 + s * 3); };
const target = f => -25 + gauss(f, 60, 3, 0.8) + gauss(f, 320, -1, 1) + gauss(f, 3500, 1, 1) + hp(f, 30, 3) + lp(f, 14500, 2);
const outC = f => target(f) + gauss(f, 46, 3.4, 0.45) + gauss(f, 300, -1.3, 0.8) + gauss(f, 11000, -1.8, 0.6) + rip(f, 1) * (f < 200 ? 1.3 : 0.7);
const inC = f => outC(f) - 2.2 + gauss(f, 30, 5, 0.5) + gauss(f, 5600, 1.6, 0.6) + rip(f, 4) * 0.6;
const peakC = f => outC(f) + 4 + 1.4 * Math.abs(rip(f, 7));
const corW = f => 1.6 + gauss(f, 22, 2.2, 1) + gauss(f, 17000, 2.4, 0.9);
const bell = (f, f0, g, q) => gauss(f, f0, g, 0.6 / q);
const lshelf = (f, f0, g) => g / (1 + Math.pow(f / f0, 2));
const hshelf = (f, f0, g) => g / (1 + Math.pow(f0 / f, 2));
const eqC = f => hp(f, 25, 4) + lshelf(f, 40, -1.5) + bell(f, 280, -2, 1.2) + bell(f, 4800, -2.5, 2) + hshelf(f, 10000, 1);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
function note(f) { const n = 12 * Math.log2(f / 440) + 69, r = Math.round(n), c = Math.round((n - r) * 100); return { name: NOTES[(r % 12 + 12) % 12] + (Math.floor(r / 12) - 1), cents: c }; }
const m = x => (x < 0 ? '−' : '+') + Math.abs(x).toFixed(1);
const mn = (x, d = 1) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
function path(fn, w, h, y0, y1, lo = 20, hi = 20000, steps = 360) {
  let d = '';
  for (let i = 0; i <= steps; i++) {

  'st.mid': ['Mid width', '0 … 200%', 'Ручка задаёт ширину стерео для средних частот. 0% — моно, 100% — без изменений, 200% — максимальная ширина.', TIPW, 'Большая ширина может ослабить звук в моно. Проверьте корреляцию на вкладке Stereo: она показывает, насколько похожи левый и правый каналы.'],
  'st.high': ['High width', '0 … 200%', 'Ручка задаёт ширину стерео для высоких частот. 0% — моно, 100% — без изменений, 200% — максимальная ширина.', TIPH, 'Широкие высокие частоты дают «воздух». Проверьте звук в моно: тарелки не должны пропадать.'],
  'cl.thr': ['Thresh', '−12 … 0 dBFS', 'Ручка задаёт уровень, выше которого Clipper срезает пики.', TIPH, 'Смотрите на значение Peak: оно показывает, на сколько Clipper срезает пики. Обычное значение — 0–4 dB.'],
  'cl.mix': ['Mix', '0 … 100%', 'Ручка смешивает обработанный сигнал и исходный сигнал. 100% — только обработанный сигнал.', TIPH, 'Малое значение делает действие Clipper слабее.'],
  'li.drive': ['Drive', '0 … 24 dB', 'Ручка поднимает уровень сигнала перед лимитером. Трек становится громче.', TIPW, 'Большое значение сплющивает удары барабанов. Сравните звук с Bypass, когда включён Match.'],
  'li.ceil': ['Ceiling', '−3 … 0 dBTP', 'Ручка задаёт максимальный уровень true peak на выходе.', TIPH, 'Для стриминга используйте −1.0 dBTP. Так звук не перегружается после перевода в MP3 и AAC.'],
  'li.rel': ['Release', '10 … 500 ms, Auto', 'Ручка задаёт, как быстро лимитер возвращает уровень после пика. В режиме Auto лимитер выбирает время по музыке.', TIPH, 'Короткое время даёт больше громкости, но добавляет искажения. Начните с Auto.'],
  'li.la': ['Lookahead', '0.5 … 5 ms', 'Ручка задаёт, на сколько раньше лимитер видит пик. Лимитер начинает уменьшать уровень до пика.', TIPH, 'Большое значение делает удары мягче. Малое значение сохраняет атаку барабанов. Начните с 2 ms.'],
  'out.gain': ['Gain', '−12 … +12 dB', 'Ручка изменяет уровень сигнала после всех модулей.', TIPW, 'Gain стоит после лимитера. Подъём уровня может дать true peak выше Ceiling. Обычно оставляйте 0.0 dB.'],
};
const kt = document.createElement('div'); kt.className = 'ktip'; kt.style.display = 'none';
function showKnobTip(el) {
  const id = el.dataset.k, d = KTIPS[id]; if (!d) return;
  const [mod, modText] = KMOD[id.split('.')[0]];
  const off = el.closest('.card').classList.contains('off');
  const nw = t => t.replace(/(\d[\d.]*–\d[\d.]*|\d[\d.]*) (Hz|kHz|dB|ms)/g, '<span style="white-space:nowrap">$1&nbsp;$2</span>');
  kt.innerHTML = `<div class="h"><b>${mod} · ${d[0]}</b><span>${d[1]}</span></div>`
    + (off ? `<div class="s w"><i>Статус</i><span>Модуль выключен (Bypassed). Ручка сейчас не изменяет звук.</span></div>` : '')
    + `<div class="s"><i>Модуль</i><span>${nw(modText)}</span></div>`
    + `<div class="s"><i>Ручка</i><span>${nw(d[2])}</span></div>`
    + `<div class="s ${d[3] === TIPW ? 'w' : ''}"><i>${d[3]}</i><span>${nw(d[4])}</span></div>`
    + `<div class="f"><span>Двойной клик — сброс · Shift — точно</span></div>`;
  kt.style.display = 'block';
  const wr = win.getBoundingClientRect(), sc = wr.width / DW, r = el.getBoundingClientRect();
  const kx = (r.left - wr.left) / sc, ky = (r.top - wr.top) / sc, kw = r.width / sc, kh = r.height / sc;
  const tw = kt.offsetWidth, th = kt.offsetHeight, gap = 10;
  const x = Math.max(8, Math.min(DW - tw - 8, kx + kw / 2 - tw / 2));
  const up = ky - th - gap >= 8;
  const y = up ? ky - th - gap : ky + kh + gap;
  kt.className = 'ktip ' + (up ? 'up' : 'dn');
  kt.style.left = x + 'px'; kt.style.top = y + 'px';
  kt.style.setProperty('--ax', (kx + kw / 2 - x) + 'px');
  document.querySelectorAll('.knob.hov').forEach(k => k.classList.remove('hov'));
  el.classList.add('hov');
}
function hideKnobTip() { kt.style.display = 'none'; document.querySelectorAll('.knob.hov').forEach(k => k.classList.remove('hov')); }
let ktTimer = 0;
function bindKnobs() {
  win.querySelectorAll('.knob[data-k]').forEach(el => {
    el.addEventListener('mouseenter', () => { clearTimeout(ktTimer); ktTimer = setTimeout(() => showKnobTip(el), 500); });
    el.addEventListener('mouseleave', () => { clearTimeout(ktTimer); hideKnobTip(); });
    el.addEventListener('mousedown', () => { clearTimeout(ktTimer); hideKnobTip(); });
  });
}

/* ---------- interactive mockup (v2): mockup bar and clickable window parts ---------- */
function toast(text) {
  const t = document.getElementById('mToast'); if (!t) return;
  t.textContent = text; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600);
}
function setView(v) { VIEW = v; render(); }
function bindWindow() {
  win.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => {
    const n = el.textContent.trim();
    if (n === 'Master') setView('master');
    else if (n === 'Eyes') setView('eyes');
    else if (n === 'Overview') setView('compact');
    else toast(`Вкладка ${n.replace(' ▾', '')} будет в следующих макетах.`);
  }));
  const mon = win.querySelector('.monGrp');
  if (mon) mon.addEventListener('click', () => { MON = !MON; render(); });
  const size = win.querySelector('.btn.size');
  if (size) size.addEventListener('click', () => { if (COMPACT) { VIEW = 'master'; SIZE = 100; } else SIZE = SIZE === 100 ? 120 : 100; render(); });
  const sub = win.querySelector('.ck'), tip = win.querySelector('#subTip');
  if (sub && tip && VIEW === 'eyes') {
    sub.addEventListener('mouseenter', () => { tip.style.display = 'block'; sub.classList.add('hl'); });
    sub.addEventListener('mouseleave', () => { if (!TIP) { tip.style.display = 'none'; sub.classList.remove('hl'); } });
  }
}
function syncBar() {
  document.querySelectorAll('#mbar [data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === VIEW));
  document.querySelectorAll('#mbar [data-size]').forEach(b => b.classList.toggle('on', !COMPACT && +b.dataset.size === SIZE));
  const m = document.getElementById('mMon');
  if (m) { m.classList.toggle('on', MON); m.textContent = MON ? 'Мониторинг: вкл' : 'Мониторинг: выкл'; }
}
function render() {
  COMPACT = VIEW === 'compact'; DW = COMPACT ? 640 : 1280; DH = COMPACT ? 400 : 800;
  win.className = 'win' + (MON ? ' monitor' : '') + (COMPACT ? ' c' : '');
  win.style.width = DW + 'px'; win.style.height = DH + 'px';
  win.innerHTML = topBar() + tabs(COMPACT ? 'Overview' : VIEW === 'eyes' ? 'Eyes' : 'Master') + (COMPACT ? compact() : VIEW === 'eyes' ? eyes() : master()) + footer();
  kt.style.display = 'none'; win.appendChild(kt);
  bindKnobs(); if (!SHOT) bindWindow();
  syncBar(); fit();
}
const mbar = document.getElementById('mbar');
if (SHOT) mbar.hidden = true;
else {
  mbar.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  mbar.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => { SIZE = +b.dataset.size; if (COMPACT) VIEW = 'master'; render(); }));
  document.getElementById('mMon').addEventListener('click', () => { MON = !MON; render(); });
}
render();
if (document.fonts) document.fonts.ready.then(fit);
const PIN = P.get('knob');
if (PIN) { const el = document.querySelector(`.knob[data-k="${PIN}"]`); if (el) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => showKnobTip(el)); }
</script>
