<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MasterMind main window mockup v20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  MasterMind M1 mockup, version 3, 2026-11-26. Not plugin code.
  v3: smaller spectrum; all ten modules fit in two rows without scrolling.
  v4: a tooltip with a recommendation on every control the user can operate.
  v5: Master becomes one workspace: smaller spectrum, a module bar, a module editor that shows
      every control of the selected module (no double-click panel), and an always-visible
      balance column (tonal balance, loudness, checks). Extra query parameter: mod=<module key>.
  v6: every threshold knob has an outer ring that shows the live signal against the threshold;
      the Saturation editor is graphical (band graph with drive and crossover handles, a type
      list and a transfer curve per band). Extra view: view=knobs (threshold ring states).
  v7: a yellow or red tonal balance row shows an advice tooltip: status, what you hear, how to
      fix it with MasterMind modules. Extra view: view=tbtips (all twelve advice texts).
  v8: EQ bands are edited on the spectrum: double-click adds a band (low cut at the left edge,
      high cut at the right edge, bell elsewhere), drag, wheel for Q, Alt+click deletes, right-click
      menu, a floating band panel with typed frequency or note entry and note snap. The Master
      spectrum is taller; the multiband crossover bar is slimmer. Query: sel, menu=1, edit=freq, demo=lowcut.
  v9: the Dynamic EQ editor repeats the band panel: Freq with the note, Gain or Slope, Q, Snap and
      Delete as typed fields; its On, type, placement and Dynamic controls work. Query: eloc=ed.
  v10: the Monitor block (headphone/speaker correction, system emulation, listen menu) is removed
      from the top bar. A red MONITOR ON badge appears only while reference B or a band listen
      plays (monitor=1 shows reference B playing).
  v11: References tab (library folder, list, slots 1-6, drop zone), a guide on the Album tab, and an
      experimental Auto match on Eyes. Views: refs, crefs (compact), album; eyes with auto=run|done; drop=1.
  v12: graphical Stereo editor (width per band against the mix and the reference, vectorscope,
      correlation with the guard threshold), Saturation band solo and mute, Multiband tooltips with
      (v13: graphical Low-End editor, advice on every knob, knob tooltips without the module section;
      view newtips lists the new texts)
      (v14: Clipper with Drive up to +24 dB, waveform before/after, transfer curve, modes with pictures; ?cltype=0..3;
      Output with a loudness target that sets the Clipper and the Limiter; ?outrun=run|done)
      (v15: graphical Limiter: level over time with the gain reduction, meters, modes with pictures; ?limode=0..2)
      (v16: spectral Limiter: 26 hearing bands, each limited on its own; band panel, Bands selector,
       Adaptive Gain / Speed / Transient knobs; ?libands=1|8|16|26)
      (v17: Inflator replaces the Clipper: waveform before/after, curve, harmonics, inflate meter;
       ?ifcurve=-50..50&ifeff=0..100&ifsplit=1)
      advice per band and whole-number values, Auto match over all ten modules. View: mbtips.
  Extra query parameter: t=<tooltip id>[:index] pins one control tooltip.
  v2 adds knob tooltips (Russian text, ASD-STE100 writing rules). Hover a knob to see one.
  Query parameters: view=master|eyes|compact, monitor=0|1, tip=0|1, knob=<knob id> (pins one knob tooltip)
  The design is drawn at the mode's reference size (Full 1280x800, Compact 640x400)
  and scaled uniformly to the viewport, like the plugin's fluid vector scaling.
-->
<style>
:root{
  --bg:#111317; --panel:#171a20; --panel2:#1d2129; --sunk:#0d0f13; --line:#272c35; --line2:#343a46;
  --text:#e8eaee; --text2:#a4acb9; --text3:#6f7786;
  --blue:#4ea1ff; --orange:#ff9f43; --yellow:#ffd84d; --magenta:#e35bd8;
  --ok:#3ccf91; --warn:#f2c23a; --bad:#ff5468; --info:#7fb3ff; --mon:#e3262f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:12px;color:var(--text);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
.win{background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.win.monitor::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--mon);z-index:5}
.win.monitor{box-shadow:inset 0 0 0 2px var(--mon)}

/* top bar */
.top{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:15px;white-space:nowrap;margin-right:2px;letter-spacing:.1px}
.logo b{color:var(--orange);font-weight:700}
.grp{display:flex;align-items:center;gap:4px;height:36px;padding:0 5px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.grp .cap{color:var(--text3);font-size:12px;margin:0 2px 0 1px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 7px;border-radius:5px;background:#262b34;border:1px solid var(--line2);color:var(--text);white-space:nowrap}
.btn.ic{width:22px;padding:0;color:var(--text2)}
.btn.tog.on{background:#2d4f7c;border-color:#4a76ad;color:#fff}
.btn.size{font-weight:600;min-width:50px}
.dd{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 7px;border-radius:5px;background:var(--sunk);border:1px solid var(--line2);white-space:nowrap}
.dd .car{color:var(--text3);font-size:10px;margin-left:auto}
.dd .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dd .mod{margin-left:-4px}
.mod{color:var(--orange);font-weight:700}
.seg{display:inline-flex;height:24px;border:1px solid var(--line2);border-radius:5px;overflow:hidden;background:var(--sunk)}
.seg span{display:flex;align-items:center;padding:0 7px;color:var(--text2);border-right:1px solid var(--line2)}
.seg span:last-child{border-right:0}
.seg span.on{background:#2d4f7c;color:#fff}
.ro{color:var(--text2);margin-left:2px}
.monGrp.active{background:var(--mon);border-color:#ff6a70}
.monGrp.active .cap{color:#fff}
.monBadge{display:none;font-weight:700;color:#fff;letter-spacing:.2px;padding:0 4px}
.monGrp.active .monBadge{display:inline-flex}
.monGrp.active .seg{background:#7d1218;border-color:#ff8a8f}
.monGrp.active .seg span{color:#ffd9db;border-color:#ff8a8f}
.monGrp.active .seg span.on{background:#fff;color:#a3121a;font-weight:600}
.monGrp.active .dd{background:#7d1218;border-color:#ff8a8f;color:#fff}
.monGrp.active .dd .car{color:#ffc2c5}
.ref{width:22px;height:24px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);color:var(--text2);background:#262b34;font-weight:500}
.ref.empty{background:transparent;border-style:dashed;color:var(--text3);opacity:.45;cursor:default !important}
.rgn{display:inline-block;padding:1px 6px;border-radius:4px;background:#163152;color:#cfe3ff;font-size:11.5px}
.ref.sel{background:var(--magenta);border-color:var(--magenta);color:#1a0b19;font-weight:700}
.ref.sel{width:36px;gap:4px}.ref .pi.pz{width:6px;height:8px;border-left:2px solid;border-right:2px solid;box-sizing:border-box}.ref .pi{font-style:normal;font-size:8px;line-height:1;letter-spacing:-1px}
.ref.sel.paused{background:transparent;color:var(--magenta);border-width:1.5px}
.ref.sel.play{box-shadow:0 0 0 2px rgba(227,91,216,.28)}
.meters{gap:9px;padding:0 8px}
.mtr{display:flex;align-items:baseline;gap:4px}
.mtr .k{color:var(--text3)}
.mtr .v{font-size:15px;font-weight:600}
.mtr .u{color:var(--text3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;align-self:center}
.spacer{flex:1}

/* tabs */
.tabs{height:34px;flex:none;display:flex;align-items:stretch;gap:2px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;padding:0 14px;color:var(--text2);font-weight:500;border-bottom:2px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--orange)}
.tabs .right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--text2)}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--text2)}
.chk i{width:13px;height:13px;border-radius:3px;border:1px solid var(--line2);background:#2d4f7c;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;color:#fff}

/* content */
.content{flex:1;min-height:0;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.ph{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-size:13px;font-weight:600;white-space:nowrap}
.ph .sub{color:var(--text3);white-space:nowrap}
.ph .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.legend{display:flex;gap:10px;color:var(--text2);white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
.approx{color:var(--text3);font-style:italic}

/* footer */
.foot{height:38px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--text3)}
.foot .hint{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;line-height:15px}
.foot .hint div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .hint b{color:var(--text);font-weight:700}.foot .hint .val{color:var(--text2);font-weight:600}
.foot .hint .l1{color:var(--text2)}.foot .hint .l2{color:var(--text2)}.foot .hint i{font-style:normal;color:#ffb877;font-weight:600}
.foot .hint i.w{color:#ff8a95}.foot .hint .dim{color:var(--text3)}
.foot.on{background:#1d2027}.foot.on .hint{border-left:2px solid var(--magenta);padding-left:9px;margin-left:-11px}
.foot .right{flex-direction:column;align-items:flex-end;gap:2px !important;line-height:15px}
.foot .right span{white-space:nowrap}
.foot .right{margin-left:auto;display:flex;gap:16px;padding-right:14px}
.grip{position:absolute;right:2px;bottom:2px;width:12px;height:12px;background:
  linear-gradient(135deg,transparent 0 55%,var(--text3) 55% 62%,transparent 62% 72%,var(--text3) 72% 79%,transparent 79%)}

/* module strip */
.strip{flex:none}
.chainmap{display:flex;gap:4px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--text2)}
.pill.cur{border-color:var(--orange);color:#fff}
.led{width:7px;height:7px;border-radius:50%;background:#3a404b;display:inline-block;flex:none}
.led.on{background:var(--ok);box-shadow:0 0 6px rgba(60,207,145,.7)}
.cards{display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;flex:1;min-height:0}
.crow{display:flex;gap:8px;flex:1;min-height:0}
.card{flex:1 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:7px;display:flex;flex-direction:column}
.card.off{opacity:.55}
.card.cur{border-color:var(--orange)}
/* info rows and band chips take the card width but do not widen the card */
.cbd > .row:not(.bars),.cbd > .bandchips{contain:inline-size}
.card .chd{height:28px;display:flex;align-items:center;gap:7px;padding:0 9px;border-bottom:1px solid var(--line)}
.card .chd b{font-weight:600;white-space:nowrap}
.card .chd .r{margin-left:auto;color:var(--text3);white-space:nowrap}
.card .cbd{flex:1;padding:7px 8px 6px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px 4px}
.knob{min-width:48px;padding:0 2px;display:flex;flex-direction:column;align-items:center}
.knob .kv{font-weight:600;margin-top:1px;white-space:nowrap}
.knob .kl{color:var(--text3);white-space:nowrap}
.row{display:flex;align-items:center;gap:6px;width:100%}
.mini{color:var(--text3)}
.grbar{display:flex;flex-direction:column;align-items:center;gap:3px;width:34px}
.grbar .t{width:10px;height:50px;border-radius:3px;background:var(--sunk);border:1px solid var(--line2);position:relative;overflow:hidden}
.grbar .t i{position:absolute;left:0;right:0;top:0;background:var(--orange)}
.scroll{height:6px;margin:6px 10px 6px;border-radius:3px;background:var(--sunk);position:relative}
.scroll i{position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:3px;background:#3a414d}
.bandchips{display:flex;gap:3px;width:100%}
.bandchips span{flex:1;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:var(--sunk);border:1px solid var(--line2);color:var(--text3)}
.bandchips span.a{color:var(--text);border-color:#6b5d2a}
.bandchips span.s{background:var(--yellow);color:#1b1600;border-color:var(--yellow);font-weight:700}

/* eyes */
.grid{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:510px 1fr 318px;grid-template-rows:362px 1fr}
.tb{padding:6px 12px 8px;display:flex;flex-direction:column;gap:4px;flex:1}
.tbrow{display:grid;grid-template-columns:92px 1fr 64px 22px;align-items:center;gap:10px;height:33px}
.tbrow .n b{display:block;font-weight:600}
.tbrow .n span{color:var(--text3)}
.track{position:relative;height:22px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.track .cor{position:absolute;top:0;bottom:0;background:rgba(78,161,255,.16);border-left:1px solid rgba(78,161,255,.5);border-right:1px solid rgba(78,161,255,.5)}
.track .zero{position:absolute;top:-3px;bottom:-3px;width:2px;background:#cfe3ff;left:50%;margin-left:-1px}
.track .val{position:absolute;top:5px;bottom:5px;border-radius:2px}
.track .mk{position:absolute;top:2px;bottom:2px;width:4px;border-radius:2px;margin-left:-2px;background:#fff}
.tbrow .num{text-align:right;font-weight:600;font-size:14px}
.scale{display:grid;grid-template-columns:92px 1fr 64px 22px;gap:10px;color:var(--text3)}
.scale div.s{display:flex;justify-content:space-between}
.sentence{margin-top:auto;padding:8px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.sentence b{font-weight:600}
.light{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#111;flex:none}
.light.ok{background:var(--ok);border-radius:50%}
.light.warn{background:var(--warn);clip-path:polygon(50% 4%,98% 94%,2% 94%);padding-top:4px}
.light.bad{background:var(--bad);border-radius:3px}
.light.info{background:transparent;border:1.5px solid var(--info);border-radius:50%;color:var(--info);font-style:italic;font-family:Georgia,serif}
.ld{padding:8px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.big{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.bigv{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.bigv .k{color:var(--text3)}
.bigv .v{font-size:26px;font-weight:600;line-height:1.15}
.bigv.main .v{font-size:30px;color:#fff}
.bigv .u{color:var(--text2);font-size:12px;margin-left:3px;font-weight:500}
.kv4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kvc{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;line-height:1.3}
.kvc .k{color:var(--text3)}
.kvc .v{font-weight:600;font-size:14px}
.kvc .v small{font-size:12px;color:var(--text2);font-weight:500}
.checks{padding:4px 6px;display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:22px 1fr auto;column-gap:8px;align-items:center;padding:5px 6px;border-radius:6px;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .t{font-weight:600}
.ck .d{grid-column:2/4;color:var(--text2);font-size:12px;line-height:1.3}
.ck .v{font-weight:600;text-align:right}
.ck.hl{background:#2a1f25;outline:1px solid #6d3341}
.tip{position:absolute;z-index:10;width:290px;padding:10px 12px;border-radius:8px;background:#f2f4f7;color:#15171b;box-shadow:0 8px 24px rgba(0,0,0,.55);line-height:1.4}
.tip b{display:block;margin-bottom:3px}
.tip::after{content:"";position:absolute;right:-7px;top:18px;border:7px solid transparent;border-right:0;border-left-color:#f2f4f7}
.stereo{display:flex;gap:12px;padding:8px 12px;flex:1;min-height:0}
table.bt{border-collapse:collapse;width:100%}
table.bt th{color:var(--text3);font-weight:500;text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
table.bt th:first-child,table.bt td:first-child{text-align:left}
table.bt td{padding:4px 4px;text-align:right;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
.corr{position:relative;height:16px;border-radius:4px;background:linear-gradient(90deg,rgba(255,84,104,.35),rgba(242,194,58,.25) 50%,rgba(60,207,145,.35));border:1px solid var(--line2)}
.corr i{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:#fff;border-radius:2px}
.cs{display:flex;justify-content:space-between;color:var(--text3);margin-top:2px}

/* compact */
.c .top{height:38px;gap:6px;padding:0 6px}
.c .logo{font-size:13px}
.c .grp{height:28px;padding:0 4px;gap:3px}
.c .btn,.c .dd,.c .seg{height:22px}
.c .tabs{height:28px;padding:0 6px}
.c .tab{padding:0 9px}
.c .content{padding:6px;gap:6px}
.c .foot{height:30px;font-size:10.5px;gap:10px;padding:0 8px}.c .foot .hint,.c .foot .right{line-height:13px;gap:1px}
.c .ph{height:28px;padding:0 8px}
.c .ck{padding:3px 4px;column-gap:6px}
.c .light{width:15px;height:15px;font-size:10px}
/* knob tooltips (v2) */
.knob{cursor:pointer;border-radius:6px}
.knob.hov{background:#262b34;box-shadow:0 0 0 1px var(--line2)}
.ktip{position:absolute;z-index:20;width:356px;padding:10px 12px 8px;border-radius:8px;background:#f2f4f7;color:#15171b;box-shadow:0 10px 28px rgba(0,0,0,.6);line-height:1.38;font-size:12px;pointer-events:none}
.ktip .h{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.ktip .h b{font-size:13px;white-space:nowrap}
.ktip .h span{margin-left:auto;color:#3f4652;font-weight:600;white-space:nowrap}
.ktip .s{display:grid;grid-template-columns:78px 1fr;column-gap:6px;margin-top:5px}
.ktip .s i{font-style:normal;color:#5b6370;font-weight:600}
.ktip .s.w i{color:#b3261e}
.ktip .f{margin-top:8px;padding-top:5px;border-top:1px solid #d3d8df;color:#5b6370;display:flex;gap:8px}
.ktip .f .off{margin-left:auto;color:#b3261e;font-weight:600;white-space:nowrap}
.ktip::after{content:"";position:absolute;left:var(--ax,50%);margin-left:-7px;border:7px solid transparent}
.ktip.up::after{bottom:-14px;border-top-color:#f2f4f7}
.ktip.dn::after{top:-14px;border-bottom-color:#f2f4f7}

/* ---------- v5: Master workspace ---------- */
.ws{flex:1;min-height:0;display:grid;grid-template-columns:1fr 380px;gap:8px}
.wsl{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.wsr{display:flex;flex-direction:column;gap:8px;min-height:0}
.mbar{flex:none;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.tile{height:50px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;min-width:0;position:relative}
.tile .tn{font-weight:600;white-space:nowrap;overflow:hidden;padding-right:10px}
.tile .led{position:absolute;top:8px;right:7px}
.tile .ts{color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts b{color:var(--orange);font-weight:600}
.tile.off{opacity:.55}
.tile.sel{border-color:var(--orange);background:#25221d}
.tile.sel::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--orange)}
.tile .gr{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.tile .gr i{display:block;height:100%;background:var(--orange)}
.ed{flex:1;min-height:0}
.edb{flex:1;min-height:0;padding:8px 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.xo{height:28px;flex:none;position:relative;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.xo .bandseg{position:absolute;top:0;bottom:0;display:flex;flex-direction:row;align-items:center;gap:5px;padding:0 0 0 6px;color:var(--text3);white-space:nowrap;overflow:hidden}
.xo .bandseg b{color:var(--text);font-weight:600}
.xo .grfill{position:absolute;left:0;right:0;top:0;background:rgba(255,159,67,.28)}
.xo .h{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--yellow)}

  <span class="mi mh">Наведите курсор на любую ручку, кнопку или список: через 0,5 с появится подсказка. Вкладки и кнопка размера в окне тоже нажимаются.</span>

<script>
const P = new URLSearchParams(location.search);
let VIEW = P.get('view') || 'master';
let MON = P.get('monitor') === '1';
const LEAUTO = P.get('leauto') === '1';
let TIP = P.get('tip') === '1';
let COMPACT = VIEW === 'compact' || VIEW === 'cmaster' || VIEW === 'crefs';
let DW = COMPACT ? 640 : 1280, DH = COMPACT ? 400 : 800;
let SIZE = 100; // 100 or 120, interactive mode only
let MOD = P.get('mod') || 'mb';
const SHOT = location.search.length > 1; // query string = static PNG render, no mockup bar

/* ---------- helpers ---------- */
const LF = Math.log10(20), HF = Math.log10(20000);
const fx = (f, w, lo = 20, hi = 20000) => (Math.log10(f) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * w;
const gauss = (f, f0, g, bw) => { const o = Math.log2(f / f0); return g * Math.exp(-(o * o) / (2 * bw * bw)); };
const hp = (f, fc, n) => -10 * Math.log10(1 + Math.pow(fc / f, 2 * n));
const lp = (f, fc, n) => -10 * Math.log10(1 + Math.pow(f / fc, 2 * n));
const rip = (f, s) => { const l = Math.log2(f); return 0.9 * Math.sin(l * 5.1 + s) + 0.6 * Math.sin(l * 11.3 + s * 2) + 0.35 * Math.sin(l * 23.7 + s * 3); };
const target = f => -25 + gauss(f, 60, 3, 0.8) + gauss(f, 320, -1, 1) + gauss(f, 3500, 1, 1) + hp(f, 30, 3) + lp(f, 14500, 2);
const outC = f => target(f) + gauss(f, 46, 3.4, 0.45) + gauss(f, 300, -1.3, 0.8) + gauss(f, 11000, -1.8, 0.6) + rip(f, 1) * (f < 200 ? 1.3 : 0.7);
const inC = f => outC(f) - 2.2 + gauss(f, 30, 5, 0.5) + gauss(f, 5600, 1.6, 0.6) + rip(f, 4) * 0.6;
const peakC = f => outC(f) + 4 + 1.4 * Math.abs(rip(f, 7));
const corW = f => 1.6 + gauss(f, 22, 2.2, 1) + gauss(f, 17000, 2.4, 0.9);
const bell = (f, f0, g, q) => gauss(f, f0, g, 0.6 / q);
const lshelf = (f, f0, g) => g / (1 + Math.pow(f / f0, 2));
const hshelf = (f, f0, g) => g / (1 + Math.pow(f0 / f, 2));
/* v8: EQ band model. used = the band exists on the spectrum, on = not bypassed. */
const EQTYPES = n => n === 1 ? ['Low shelf', 'Low cut'] : n === 10 ? ['High shelf', 'High cut'] : ['Bell', 'Low shelf', 'High shelf', 'Notch'];
const PLACES = ['Stereo', 'Mid', 'Side', 'Left', 'Right'];
const SLOPES = [6, 12, 18, 24, 36, 48];
const EQB = Array.from({ length: 10 }, (_, i) => ({ n: i + 1, used: 0, on: 1, type: EQTYPES(i + 1)[0], f: [30, 100, 280, 600, 4800, 2000, 5000, 10000, 12000, 16000][i], g: 0, q: 0.71, slope: 24, place: 'Stereo', dyn: 0 }));
Object.assign(EQB[0], { used: 1, f: 40, g: -1.5 });
Object.assign(EQB[2], { used: 1, f: 280, g: -2, q: 1.2 });
Object.assign(EQB[4], { used: 1, type: 'Bell', f: 4800, g: -2.5, q: 2, dyn: 1 });
Object.assign(EQB[7], { used: 1, type: 'High shelf', f: 10000, g: 1 });
let SELB = +(P.get('sel') || 5), MENU = P.get('menu') === '1' ? SELB : 0, EDIT = P.get('edit') || '', SNAP = false, EDITV = '';
if (P.get('demo') === 'lowcut') { Object.assign(EQB[0], { type: 'Low cut', f: 41.2, slope: 24 }); SELB = 1; EDITV = 'E1'; }

  'pre.saveas': ['Save As', '', 'Кнопка сохраняет настройки как новый пресет с новым именем.', TIPH, 'Сделайте отдельный пресет для каждого альбома или звука.'],
  'bypass': ['Bypass', 'вкл / выкл', 'Кнопка выключает всю цепочку обработки. Вы слышите исходный микс.', TIPH, 'Включите Match Volume. Тогда вы сравниваете звук, а не громкость.'],
  'match': ['Match Volume', 'вкл / выкл', 'Кнопка выравнивает громкость при Bypass. Исходный микс играет с той же громкостью, что и обработанный звук.', TIPH, 'Громкий звук всегда кажется лучше. Держите Match Volume включённым, когда вы сравниваете.'],
  'mon': ['Monitor', 'Off, Headphones, Speakers', 'Список включает коррекцию звука для ваших наушников или колонок. Off — без коррекции.', TIPW, 'Коррекция изменяет только то, что вы слышите. При офлайн-рендере плагин выключает её сам. Перед рендером в реальном времени выключите её вручную.'],
  'sys': ['System', 'Off, Laptop, Phone, Bluetooth, Earbuds, Car, Bookshelf', 'Список включает имитацию другой системы прослушивания. Имитация — примерная, это не измерение.', TIPH, 'Включите Laptop. Если главный рифф пропадает, низким нотам не хватает гармоник. Добавьте Translator в модуле Low-End.'],
  'ref': ['Референс {n}', 'клик — переключить', 'Клик переключает референс: анализ, Checks и Auto match берут его. Звук кнопка не включает. Если референс уже в плеере, плеер переходит на эту песню и играет или стоит на паузе, как раньше.', TIPH, 'Загружают песни и включают их на вкладке References. Правый клик по кнопке ничего не делает.'],
  'ref.empty': ['Слот референса {n}', 'пусто, неактивна', 'В слоте нет песни, поэтому кнопка неактивна и ничего не делает.', TIPH, 'Откройте вкладку References и нажмите номер {n} в строке нужной песни.'],
  'sat.type': ['Тип насыщения', 'Tube, Tape, Transformer, Diode', 'Список выбирает характер насыщения в полосе. Клик по имени выбирает тип.', TIPH, 'Tube — мягко и тепло. Tape — сглаживает пики. Transformer — плотная середина. Diode — жёстче и ярче, используйте осторожно.'],
  'sat.graph': ['График полос', 'Low, Mid, High', 'График показывает спектр на выходе и три полосы насыщения. Высота заливки полосы показывает Drive.', TIPH, 'Тяните полосу вверх или вниз, чтобы изменить Drive. Тяните жёлтую ручку влево или вправо, чтобы изменить частоту раздела.', 'Тянуть точку — Drive · тянуть жёлтую ручку — частота'],
  'sat.curve': ['Кривая передачи', '', 'Кривая показывает, как полоса изменяет форму волны: вход по горизонтали, выход по вертикали. Яркая часть кривой — уровень сигнала сейчас.', TIPH, 'Сильный изгиб даёт больше гармоник. Прямая линия — звук без изменений.'],
  'eq.add': ['Добавить полосу', 'двойной клик', 'Двойной клик по спектру добавляет полосу EQ в этой точке.', TIPH, 'У левого края (ниже 30 Hz) полоса становится Low cut. У правого края (выше 14 kHz) — High cut. В остальных местах — Bell.'],
  'eq.field': ['Точное значение', 'клик — ввод', 'Клик открывает поле ввода. Введите значение и нажмите Enter.', TIPH, 'В поле Freq можно ввести ноту: E1, D#2, A4. Полоса встаёт точно на частоту ноты.'],
  'eq.snap': ['Snap', 'вкл / выкл', 'Кнопка привязывает частоту полосы к нотам, когда вы тянете точку.', TIPH, 'Используйте Snap для низа: бочка и бас звучат на нотах строя. Срез точно по ноте убирает гул этой ноты.'],
  'eq.pow': ['Полоса вкл/выкл', '', 'Кнопка выключает полосу. Настройки полосы сохраняются.', TIPH, 'Сравните звук с полосой и без неё. Двойной клик по точке делает то же самое.'],
  'eq.del': ['Удалить полосу', 'Alt+клик по точке', 'Кнопка удаляет полосу со спектра.', TIPH, 'Чтобы только сравнить звук, выключите полосу кнопкой питания слева.'],
  'lib.slot': ['Слот {n}', 'кнопка {n} вверху', 'Кнопка назначает песню на слот {n}. Песня появляется на кнопке {n} в верхней панели.', TIPH, 'Слот может иметь только одну песню. Новая песня заменяет старую в этом слоте.'],
  'lib.del': ['Удалить из библиотеки', '', 'Кнопка удаляет песню из списка. Плагин перемещает файл в Корзину Windows.', TIPW, 'Если песня стоит в слоте, слот становится пустым.'],
  'lib.drop': ['Область добавления', 'WAV, FLAC, MP3, OGG, AIFF', 'Перетащите сюда файлы песен. Плагин копирует их в папку библиотеки и анализирует весь файл.', TIPH, 'Исходные файлы остаются на месте.'],
  'lib.folder': ['Папка библиотеки', '', 'Плагин хранит файлы референсов в этой папке. Кнопка Change выбирает другую папку.', TIPH, 'Выберите папку на диске с данными, не в Program Files.'],
  'lib.open': ['Открыть папку', '', 'Кнопка открывает папку библиотеки в Проводнике.', TIPH, 'Файлы, которые вы копируете в папку сами, тоже появляются в списке.'],
  'lib.add': ['Добавить файлы', '', 'Кнопка открывает окно выбора файлов. Выбранные файлы плагин копирует в папку библиотеки.', TIPH, 'Вы также можете перетащить файлы в область внизу.'],
  'lib.inset': ['In set', 'вкл / выкл', 'Кнопка включает песню в набор референсов. Набор задаёт цель и коридор.', TIPH, 'Для надёжной цели используйте 3–5 песен одного жанра.'],
  'lib.clear': ['Очистить слот', '', 'Кнопка удаляет песню из слота. Файл остаётся в библиотеке.', TIPH, ''],
  'ref.region': ['Волна референса', 'клик / протяжка', 'Клик — переход в это место песни. Протяжка по волне выделяет часть песни (синяя зона): анализ на вкладке Eyes, Checks и Auto match берут метрики только из неё. Края зоны можно тянуть.', TIPH, 'Выделите припев или самое плотное место — то же, что вы сравниваете в своём треке. Тогда цель честная: брейкдауны и тихие куски её не сдвигают.', '✕ на синей метке убирает выделение'],
  'ref.regionx': ['Область метрик', 'начало – конец', 'Метка показывает, из какой части песни берутся метрики. Пока плагин анализирует эту часть, рядом написано «analysing…».', TIPH, 'Обычно хватает 15–30 секунд припева. ✕ убирает выделение: снова считается вся песня.', ''],
  'lib.region': ['Метрики', 'вся песня / часть', 'Колонка показывает, из какой части песни плагин берёт метрики для анализа и Auto match.', TIPH, 'Чтобы выбрать часть, включите песню кнопкой ▶ и протяните по волне в плеере.', ''],
  'am.mode': ['Режим Auto match', 'Fast / Hybrid / Precise', 'Fast: плагин слушает 12 секунд и ставит ручки по формулам, около 30 секунд. Precise: плагин сотни раз проигрывает запись через копию всей цепочки и ищет лучший набор ручек, 2–4 минуты. Hybrid: сначала формулы, потом короткий поиск, около минуты.', TIPH, 'Начните с Hybrid. Fast — для быстрой прикидки. Precise — когда есть время и важна точность. Во всех режимах Undo возвращает все ручки.'],
  'am.go': ['Auto match', 'экспериментально', 'Кнопка записывает 12 секунд вашего трека и подстраивает модули под референс: Input, Dynamic EQ, Multiband, Low-End, Bus Comp, Saturation, Stereo, Inflator, Limiter, Output. Цель — зелёный тональный баланс, громкость, плотность и ширина референса.', TIPH, 'Включите самое громкое место песни до нажатия. После записи песню можно остановить: поиск идёт на копии цепочки. Undo возвращает все ручки.'],
  'am.undo': ['Undo', '', 'Кнопка возвращает все ручки в состояние до Auto match.', TIPH, ''],
  'st.graph': ['График ширины', 'Low, Mid, High', 'Высота полосы — ширина стерео, которую задаёт модуль. Серая заливка — ширина вашего микса сейчас. Пунктир — ширина референса.', TIPH, 'Тяните полосу вверх или вниз, чтобы изменить ширину. Тяните жёлтую ручку, чтобы изменить частоту раздела.', 'Тянуть полосу — ширина · жёлтая ручка — Split'],
  'st.scope': ['Вектороскоп', '', 'Облако точек показывает стерео сейчас. Вертикальная линия — моно. Широкое облако — широкое стерео.', TIPW, 'Если облако лежит горизонтально, сигнал в противофазе. В моно такой звук пропадает.'],
  'st.corr': ['Корреляция', '−1 … +1', 'Шкала показывает совпадение левого и правого каналов. +1 — моно, 0 — широкое стерео, −1 — противофаза. Белая черта — порог Correlation guard.', TIPH, 'Держите корреляцию выше 0. Тогда микс звучит в моно на телефоне.'],
  'sat.solo': ['Solo полосы', 'вкл / выкл', 'Кнопка оставляет в звуке только эту полосу.', TIPH, 'Слушайте полосу отдельно, чтобы выбрать тип и Drive.'],
  'sat.mute': ['Mute полосы', 'вкл / выкл', 'Кнопка удаляет эту полосу из звука.', TIPW, 'Mute влияет на итоговый звук. Выключите Mute перед рендером.'],
  'le.graph': ['График низа', '20–300 Hz', 'Оранжевая линия — середина (Mid), розовая — бока (Side). Голубая зона — где модуль делает звук моно. Пунктир — бока после модуля.', TIPH, 'Тяните голубую ручку, чтобы изменить частоту Mono. Тяните фиолетовую ручку, чтобы изменить частоту Rotator.', 'Голубая ручка — Mono · фиолетовая — Rot freq'],
  'le.auto': ['Auto (поворот фазы)', 'клик', 'Кнопка слушает низ 4 секунды, перебирает угол поворота от 0 до 360° и ставит угол, при котором пики волны вверх и вниз почти одинаковые. Rotator включается сам.', TIPH, 'Нажмите Auto во время самого громкого места песни: припев или брейкдаун. Сравните звук с Bypass: тембр почти не меняется, а лимитер получает запас.', 'Второй клик по Auto возвращает прежний угол'],
  'le.phase': ['Поворот фазы', '0 … 360°', 'Круг показывает угол поворота фазы. Две волны показывают низ до и после поворота.', TIPH, 'Ищите угол, при котором пики волны вверх и вниз одинаковые. Тогда лимитер работает меньше.', 'Тянуть по кругу — Rotate'],
  'le.transg': ['Translator', 'гармоники', 'Серый столбик — основная нота. Цветные столбики — гармоники, которые добавляет модуль. Пунктир — нижняя граница динамика телефона.', TIPH, 'Гармоники выше пунктира делают бас слышным на телефоне и ноутбуке.', ''],
  'if.clip': ['Clip 0 dB', 'вкл / выкл', 'Переключатель срезает пики выше 0 dBFS до кривой и после неё.', TIPW, 'Без Clip кривая загибает пики выше 0 dBFS вниз, и звук искажается. Держите Clip включённым.', ''],
  'if.split': ['Band split', 'вкл / выкл', 'Переключатель делит звук на три полосы: ниже 240 Hz, 240 Hz–2.4 kHz и выше 2.4 kHz. Каждая полоса проходит кривую отдельно.', TIPH, 'Так бочка и бас не изменяют звук гитар. Включите, если низ звучит грязно.', ''],
  'if.wave': ['Волна', 'до и после', 'Серая линия — сигнал до Inflator. Розовая линия — сигнал после Inflator. Тихие части волны поднимаются сильнее, чем пики.', TIPH, 'Если розовая линия почти везде выше серой, а пики почти на месте, Inflator работает правильно.', ''],
  'if.graph': ['Кривая', 'вход → выход', 'Кривая показывает, как Inflator изменяет уровень: вход по горизонтали, выход по вертикали. Пунктир — без изменений. Серые линии — Curve −50 и +50. Точка — текущий уровень.', TIPH, 'Чем выше розовая кривая над пунктиром, тем плотнее звук.', ''],
  'if.harm': ['Гармоники и громкость', '3, 5, 7, 9', 'Столбики показывают гармоники, которые добавляет Inflator на текущем уровне. Справа — на сколько dB Inflator поднимает громкость.', TIPH, 'Inflator добавляет только нечётные гармоники. Если 3-я гармоника выше −30 dB, звук становится заметно грязнее.', ''],
  'cl.wave': ['Волна', 'до и после', 'Серая линия — сигнал после Drive. Розовая линия — сигнал после Clipper. Красные штрихи — срезанные пики. Пунктир — порог Thresh.', TIPH, 'Если красные штрихи есть на каждом ударе, уменьшите Drive. Лучше срезать только самые острые пики.', ''],
  'cl.curve': ['Кривая', 'вход → выход', 'Кривая показывает, как Clipper меняет уровень: вход по горизонтали, выход по вертикали. Выше порога кривая становится плоской.', TIPH, 'Плавный изгиб звучит мягче. Резкий угол даёт больше громкости, но и больше искажений.', ''],
  'cl.mode': ['Режим', 'Hard, Soft, Soft knee, Diode', 'Список выбирает форму среза. Картинка у каждого режима показывает его кривую.', TIPH, 'Hard — самый громкий и жёсткий. Soft — тёплый. Soft knee — мягкий только у порога. Diode — несимметричный, с «грязью».', 'Клик — выбрать режим'],
  'out.target': ['Целевая громкость', '−30 … −3 LUFS', 'Поле задаёт желаемую интегральную громкость трека. Клик — ввод числа, кнопки рядом — частые значения.', TIPH, 'Для стриминга используйте −14…−9 LUFS. Для громкого металла −8…−6 LUFS. Громче −7 LUFS барабаны теряют удар.', ''],
  'out.reach': ['Reach target', 'запись 12 с, около 30 с', 'Кнопка записывает 12 секунд песни. Потом копия цепочки пробует Inflator, Clip, Leveler, Density и Soften, для каждого варианта подбирает Drive до цели и оставляет вариант с наименьшими искажениями и «качанием».', TIPH, 'Включите самое громкое место песни до нажатия. Undo возвращает Inflator и Limiter. Если цель недостижима чисто, плагин ставит самый громкий вариант и пишет об этом.'],
  'out.presets': ['Частые цели', '', 'Кнопки ставят частые значения цели.', TIPH, '−14 — стриминг, −9 и −8 — современный металл, −6 и −5 — очень громко.', ''],
  'li.time': ['Уровень во времени', 'последние 6 с', 'Серая линия — уровень после Drive. Розовая линия — уровень на выходе. Оранжевая заливка сверху — ослабление (GR). Пунктир — Ceiling.', TIPH, 'Если оранжевая заливка не уходит между ударами, лимитер работает всё время. Уменьшите Drive или включите Auto release.', ''],
  'li.meters': ['Индикаторы', 'GR, true peak, overs', 'Столбики показывают ослабление сейчас и максимум. Ниже — true peak на выходе и число перегрузок.', TIPH, 'Для металла обычно хватает 2–4 dB GR. Больше 6 dB — барабаны становятся плоскими.', ''],
  'li.bands': ['Полосы', 'Classic, 8, 16, 26', 'Список выбирает, на сколько полос лимитер делит звук. Полосы повторяют то, как ухо слышит частоты.', TIPH, '26 полос работают точнее всего, задержка около 55 ms. Classic — обычный лимитер с задержкой 6 ms.', 'Клик — выбрать'],
  'li.bview': ['Полосы лимитера', 'ослабление и атаки', 'Каждый столбик — одна полоса. Оранжевый столбик вниз — ослабление полосы. Зелёный столбик вверх — подчёркнутая атака.', TIPH, 'Если оранжевые столбики одинаковы во всех полосах, увеличьте Adaptive Gain. Тогда лимитер работает только там, где пик.', ''],
  'li.mode': ['Режим', 'Transparent, Balanced, Aggressive', 'Список выбирает характер лимитера. Картинка показывает, как ослабление следует за ударом.', TIPH, 'Transparent — чисто, но тише. Balanced — для большинства миксов. Aggressive — громко и плотно, но слышно «качание».', 'Клик — выбрать режим'],
  'size': ['Размер окна', '100% / 120%', 'Кнопка переключает размер окна: 100% (1280×800) и 120% (1536×960).', TIPH, 'Вы также можете тянуть край окна мышью. Плагин запоминает размер для всех проектов.'],
  'tab.master': ['Вкладка Master', '', 'Вкладка показывает спектр, кривую эквалайзера и все модули обработки.', TIPH, 'Здесь вы изменяете звук.'],
  'tab.eyes': ['Вкладка Eyes', '', 'Вкладка показывает все измерения на одном экране: тональный баланс, громкость, низкие частоты, стерео и проверки.', TIPH, 'Начните с этой вкладки. Красные и жёлтые проверки показывают, что исправить сначала.'],
  'tab.lowend': ['Вкладка Low-End', '', 'Вкладка показывает подробный анализ низких частот: ноты, Mid и Side, форму волны.', TIPH, 'Используйте её для бочки и нижних нот 8- и 9-струнных гитар.'],
  'tab.stereo': ['Вкладка Stereo', '', 'Вкладка показывает вектороскоп, корреляцию и ширину стерео по полосам. Вектороскоп — картинка ширины и баланса стерео.', TIPH, 'Проверьте, что низкие частоты стоят по центру.'],
  'tab.spectrogram': ['Вкладка Spectrogram', '', 'Вкладка показывает спектр во времени. Цвет показывает уровень.', TIPH, 'Так видно короткие резонансы и «песок», которые обычный спектр усредняет.'],
  'tab.album': ['Вкладка Album', '', 'Вкладка сравнивает треки альбома: громкость, тональный баланс и ширину.', TIPH, 'Используйте её, чтобы треки альбома звучали как одно целое.'],
  'tab.overview': ['Вкладка Overview', '', 'Вкладка показывает спектр и список проверок.', TIPH, 'Увеличьте окно, чтобы увидеть все модули.'],
  'tab.more': ['More', '', 'Список открывает остальные вкладки.', TIPH, 'В маленьком окне часть вкладок спрятана в этом списке.'],
