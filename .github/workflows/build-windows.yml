name: build-windows

on:
  push:
  workflow_dispatch:

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        shell: pwsh
        run: |
          $hash = "${{ github.sha }}".Substring(0, 7)
          cmake -S . -B build -A x64 `
            -DMM_BUILD_NUMBER=${{ github.run_number }} `
            -DMM_GIT_HASH=$hash
          $version = Get-Content build/version.txt -Raw
          "MM_VERSION=$($version.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (Release x64)
        run: cmake --build build --config Release --parallel

      - name: Unit tests and binary null test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/${{ env.PLUGINVAL_VERSION }}/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: pluginval (strictness 5) on the flat .vst3
        shell: bash
        run: |
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process --verbose \
            --output-dir pluginval-logs --validate "build/dist/MasterMind.vst3"

      - name: Upload pluginval logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/dist/MasterMind.vst3 package/
          Copy-Item docs/README_RU.md package/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MasterMind-${{ env.MM_VERSION }}-win64-vst3
          path: package/*
          if-no-files-found: error
